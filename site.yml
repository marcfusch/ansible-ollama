# site.yml
# Déploie Ollama (conteneur Podman rootless) sur la Bazzite, puis génère la
# config OpenCode sur le Mac. Lancer avec : ansible-playbook site.yml
#   - seulement Ollama  : ansible-playbook site.yml --limit bazzite-gpu
#   - seulement OpenCode : ansible-playbook site.yml --limit localhost

- name: Déployer Ollama sur la Bazzite
  hosts: bazzite-gpu
  become: false # rootless Podman en scope utilisateur
  vars_files:
    - vars.yml
  handlers:
    - name: Recharger et redémarrer ollama
      ansible.builtin.systemd:
        name: ollama.service
        state: restarted
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ollama_uid.stdout }}"
  tasks:
    - name: Récupérer l'UID de l'utilisateur distant
      ansible.builtin.command: id -u
      register: ollama_uid
      changed_when: false

    - name: Activer le linger pour que le service tourne sans session
      ansible.builtin.command: "loginctl enable-linger {{ ansible_user_id }}"
      args:
        creates: "/var/lib/systemd/linger/{{ ansible_user_id }}"

    - name: Créer le dossier des quadlets utilisateur
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/containers/systemd"
        state: directory
        mode: "0755"

    - name: Déployer le quadlet Ollama
      ansible.builtin.template:
        src: ollama.container.j2
        dest: "{{ ansible_env.HOME }}/.config/containers/systemd/ollama.container"
        mode: "0644"
      notify: Recharger et redémarrer ollama

    - name: Recharger le daemon systemd utilisateur
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ollama_uid.stdout }}"

    - name: Arrêter le service Ollama natif Homebrew s'il existe (conflit de port 11434)
      ansible.builtin.systemd:
        name: homebrew.ollama.service
        state: stopped
        enabled: false
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ollama_uid.stdout }}"
      failed_when: false

    - name: Démarrer et activer le service Ollama
      ansible.builtin.systemd:
        name: ollama.service
        state: started
        scope: user
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ollama_uid.stdout }}"

    # Les handlers notifiés (daemon-reload + restart) doivent passer avant le pull
    - name: Appliquer les changements de quadlet en attente
      ansible.builtin.meta: flush_handlers

    - name: Attendre que l'API réponde
      ansible.builtin.uri:
        url: "http://localhost:{{ ollama_port }}/api/tags"
        status_code: 200
      register: ollama_api
      retries: 30
      delay: 5
      until: ollama_api.status == 200

    - name: Tirer les modèles
      ansible.builtin.command: "podman exec ollama ollama pull {{ item }}"
      loop: "{{ ollama_models }}"
      changed_when: true

- name: Générer la config OpenCode sur le Mac
  hosts: localhost
  connection: local
  gather_facts: true
  vars_files:
    - vars.yml
  tasks:
    - name: Créer le dossier de config OpenCode
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/opencode"
        state: directory
        mode: "0755"

    - name: Déployer la config OpenCode
      ansible.builtin.template:
        src: opencode.jsonc.j2
        dest: "{{ ansible_env.HOME }}/.config/opencode/opencode.jsonc"
        mode: "0644"
